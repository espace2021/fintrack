[project]
name = "fintrack"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "awscli>=1.46.1",
    "boto3>=1.43.106",
    "confluent-kafka>=2.16.0",
    "httpx>=0.28.1",
    "mlflow>=3.4,<4",
    "pandas>=2.2,<3",
    "pyiceberg[pandas,pyarrow,s3fs]>=0.12.0",
    "pyspark[connect]==4.1.3",
    "scikit-learn>=1.9.1",
    "trino>=0.340.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

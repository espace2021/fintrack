name: fintrack

services:
  fin-api:
    build: ./services/fin-api
    ports: ["8000:8000"]
    environment:
      API_KEY: atelier
      TX_PER_SECOND: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10

networks:
  default:
    name: lakehouse-net
    external: true
